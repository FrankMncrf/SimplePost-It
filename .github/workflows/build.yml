name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install PyQt6
      - name: Pruebas
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -v -s tests

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutable
        run: |
          pip install PyQt6 pyinstaller pillow
          pyinstaller --noconfirm packaging/pyinstaller/simplepostit.spec
      - name: Instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path simplepostit.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DVersion=$v" packaging\windows\simplepostit.iss
          Compress-Archive -Path dist\SimplePost-It -DestinationPath "dist\SimplePost-It-$v-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-setup.exe
            dist/*-portable.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: App
        run: |
          pip install PyQt6 pyinstaller pillow pyobjc-framework-Cocoa
          pyinstaller --noconfirm packaging/pyinstaller/simplepostit.spec
      - name: DMG
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' simplepostit.py)
          hdiutil create -volname SimplePost-It -srcfolder dist/SimplePost-It.app -ov -format UDZO \
            "dist/SimplePost-It-$v-macos-$(uname -m).dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .deb
        run: packaging/debian/build-deb.sh
      - name: .rpm
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' simplepostit.py)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix "SimplePost-It-$v/" -o ~/rpmbuild/SOURCES/SimplePost-It-$v.tar.gz HEAD
          docker run --rm -v ~/rpmbuild:/root/rpmbuild -v "$PWD/packaging/rpm:/spec" fedora:latest \
            sh -c "dnf install -y -q rpm-build make python3-pyqt6 && rpmbuild -ba --nocheck /spec/simplepostit.spec"
          cp ~/rpmbuild/RPMS/noarch/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Sumas SHA256
        run: cd out && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
